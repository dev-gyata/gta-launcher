name: Release

on:
  push:
    tags:
      - "v*"
    # Builds on main only refresh the caches (shared with every branch and tag; a branch's own caches are not), never publish.
    branches:
      - main
    paths:
      - "packages/torrent_engine/**"
      - "tool/release/**"
      - ".github/actions/**"
      - ".github/workflows/release.yml"
      - "pubspec.lock"
  # Weekly as well: runner images (and so the cache keys) change about once a week.
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      publish:
        description: "Builds: publish a draft release after verification (false only builds and uploads artifacts). With from_run: publish the release publicly (false makes it a draft)."
        type: boolean
        required: false
        default: false
      version:
        description: "Release tag to create (e.g. v1.0.0). Leave empty to publish a manual-build-<run> draft."
        required: false
        default: ""
      from_run:
        description: "Publish the artifacts of this earlier Release run instead of building (its commit must have the same tree as the selected ref)."
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  APP_NAME: playgta5_launcher

jobs:
  build-linux:
    name: Build Linux
    if: ${{ !inputs.from_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Cache native compilation
        uses: ./.github/actions/cache-native

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libssl-dev

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: false

      - name: Cache pub packages
        uses: ./.github/actions/cache-pub

      - run: flutter --version
      - run: flutter config --enable-linux-desktop
      - run: flutter pub get

      - name: Build Linux release
        run: flutter build linux --release

      - name: Package Linux bundle
        run: tar -czf playgta5-launcher-linux-x64.tar.gz -C build/linux/x64/release bundle

      - uses: actions/upload-artifact@v4
        with:
          name: linux-artifact
          path: playgta5-launcher-linux-x64.tar.gz
          if-no-files-found: error

  build-macos:
    name: Build macOS
    if: ${{ !inputs.from_run }}
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Cache native compilation
        uses: ./.github/actions/cache-native

      - name: Restore macOS OpenSSL
        id: openssl
        uses: actions/cache/restore@v4
        with:
          path: .dart_tool/native_dependencies/openssl-macos-arm64
          key: openssl-v1-macos-arm64-12-${{ env.CI_RUNNER_IMAGE }}-${{ hashFiles('tool/release/build_openssl_macos.sh', 'tool/release/verify_macos.py') }}

      - name: Install macOS dependencies
        run: |
          command -v cmake || brew install cmake
          if [[ '${{ steps.openssl.outputs.cache-hit }}' != 'true' ]]; then
            bash tool/release/build_openssl_macos.sh
          fi
          python3 tool/release/verify_macos.py --openssl .dart_tool/native_dependencies/openssl-macos-arm64

      # Save dependencies before app verification so a later failure does not
      # force another OpenSSL compilation on the next run.
      - name: Save macOS OpenSSL
        if: steps.openssl.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .dart_tool/native_dependencies/openssl-macos-arm64
          key: ${{ steps.openssl.outputs.cache-primary-key }}

      - name: Cache CocoaPods downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/CocoaPods
            ~/.cocoapods
          key: pods-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('macos/Podfile.lock', 'pubspec.lock') }}
          restore-keys: pods-v1-${{ runner.os }}-${{ runner.arch }}-

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: false

      - name: Cache pub packages
        uses: ./.github/actions/cache-pub

      - run: flutter --version
      - run: flutter config --enable-macos-desktop
      - run: flutter pub get

      - name: Verify native engine and Dart worker on macOS
        run: bash tool/release/verify_macos.sh

      - name: Build macOS release
        env:
          FLUTTER_XCODE_ARCHS: arm64
        run: flutter build macos --release

      - name: Verify packaged macOS app
        run: python3 tool/release/verify_macos.py --app "build/macos/Build/Products/Release/${{ env.APP_NAME }}.app"

      # ditto preserves the .app bundle symlinks/resources; plain zip corrupts it.
      - name: Package macOS app
        run: |
          cd build/macos/Build/Products/Release
          ditto -c -k --sequesterRsrc --keepParent "${{ env.APP_NAME }}.app" "$GITHUB_WORKSPACE/playgta5-launcher-macos-arm64.zip"
          cd "$GITHUB_WORKSPACE"
          ditto -x -k playgta5-launcher-macos-arm64.zip .dart_tool/macos-extracted
          python3 tool/release/verify_macos.py --app ".dart_tool/macos-extracted/${{ env.APP_NAME }}.app"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-artifact
          path: playgta5-launcher-macos-arm64.zip
          if-no-files-found: error

  build-windows:
    name: Build Windows
    if: ${{ !inputs.from_run }}
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      VCPKG_DEFAULT_TRIPLET: x64-windows-static
    steps:
      - uses: actions/checkout@v4

      - name: Cache native compilation
        uses: ./.github/actions/cache-native

      - name: Restore Windows OpenSSL
        id: openssl
        uses: actions/cache/restore@v4
        with:
          path: .dart_tool/native_dependencies/vcpkg
          # Bump the version in this key whenever the vcpkg install command below changes.
          key: openssl-v2-windows-x64-static-MT-${{ env.CI_RUNNER_IMAGE }}

      - name: Install static OpenSSL via vcpkg
        if: steps.openssl.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $installRoot = Join-Path $PWD '.dart_tool/native_dependencies/vcpkg'
          vcpkg install openssl:x64-windows-static "--x-install-root=$installRoot"
          if ($LASTEXITCODE -ne 0) { throw 'Static OpenSSL installation failed' }

      - name: Save Windows OpenSSL
        if: steps.openssl.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .dart_tool/native_dependencies/vcpkg
          key: ${{ steps.openssl.outputs.cache-primary-key }}

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: false

      - name: Cache pub packages
        uses: ./.github/actions/cache-pub

      - run: flutter --version
      - run: flutter config --enable-windows-desktop
      - run: flutter pub get

      - name: Verify native engine and Dart worker on Windows
        shell: pwsh
        run: ./tool/release/verify_windows.ps1

      - name: Build Windows release
        shell: pwsh
        run: |
          flutter build windows --release 2>&1 | Tee-Object -FilePath .dart_tool/windows-release.log
          if ($LASTEXITCODE -ne 0) { throw 'Windows release build failed' }
          if (Select-String -Path .dart_tool/windows-release.log -Pattern 'LNK4098|LNK2038|LNK2005|conflicts with use of other libs|mismatch detected for .RuntimeLibrary') {
            throw 'The release build reports conflicting C/C++ runtimes.'
          }

      - name: Verify packaged Windows app
        shell: pwsh
        run: ./tool/release/verify_windows_bundle.ps1 -Bundle build/windows/x64/runner/Release

      - name: Package Windows build
        shell: pwsh
        run: |
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath playgta5-launcher-windows-x64.zip
          Expand-Archive playgta5-launcher-windows-x64.zip .dart_tool/windows-extracted
          ./tool/release/verify_windows_bundle.ps1 -Bundle .dart_tool/windows-extracted

      - uses: actions/upload-artifact@v4
        with:
          name: windows-artifact
          path: playgta5-launcher-windows-x64.zip
          if-no-files-found: error

  build-android:
    name: Build Android
    if: ${{ !inputs.from_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: false

      - name: Cache pub packages
        uses: ./.github/actions/cache-pub

      - run: flutter --version
      - run: flutter pub get

      # Signed with the debug key for now (sideloading); the torrent engine is desktop only and not built here.
      - name: Build Android release APK
        run: flutter build apk --release

      - name: Package Android APK
        run: cp build/app/outputs/flutter-apk/app-release.apk playgta5-launcher-android.apk

      - uses: actions/upload-artifact@v4
        with:
          name: android-artifact
          path: playgta5-launcher-android.apk
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: github.ref_type == 'tag' || inputs.publish == true
    needs: [build-linux, build-macos, build-windows, build-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: ls -lh dist/

      - name: Publish binaries to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          # Tag pushes use their own tag; manual runs use the input or a run-scoped fallback.
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || inputs.version != '' && inputs.version || format('manual-build-{0}', github.run_number) }}
          draft: ${{ github.ref_type != 'tag' }}
          prerelease: false
          generate_release_notes: true
          # Same list in publish-from-run below.
          files: |
            dist/playgta5-launcher-linux-x64.tar.gz
            dist/playgta5-launcher-macos-arm64.zip
            dist/playgta5-launcher-windows-x64.zip
            dist/playgta5-launcher-android.apk

  # Publishes the artifacts of an earlier, verified Release run (e.g. the branch build of a merged PR) without rebuilding:
  # only when that run succeeded and built exactly the tree of the selected ref.
  publish-from-run:
    name: Publish from run ${{ inputs.from_run }}
    if: ${{ inputs.from_run }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check the run built this tree
        env:
          GH_TOKEN: ${{ github.token }}
          FROM_RUN: ${{ inputs.from_run }}
        run: |
          read -r sha conclusion name < <(gh run view "$FROM_RUN" --json headSha,conclusion,workflowName --jq '"\(.headSha) \(.conclusion) \(.workflowName)"')
          echo "run $FROM_RUN: $name, $conclusion, commit $sha"
          [ "$name" = "Release" ] || { echo "::error::run $FROM_RUN is not a Release run"; exit 1; }
          [ "$conclusion" = "success" ] || { echo "::error::run $FROM_RUN did not succeed"; exit 1; }
          git cat-file -e "$sha^{commit}" 2>/dev/null || git fetch --no-tags origin "$sha"
          built=$(git rev-parse "$sha^{tree}") here=$(git rev-parse "HEAD^{tree}")
          [ "$built" = "$here" ] || { echo "::error::run $FROM_RUN built a different tree ($built) than $GITHUB_REF ($here)"; exit 1; }

      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.from_run }}
          github-token: ${{ github.token }}
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: ls -lh dist/

      - name: Publish binaries to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version != '' && inputs.version || format('manual-build-{0}', github.run_number) }}
          target_commitish: ${{ github.sha }}
          draft: ${{ !inputs.publish }}
          prerelease: false
          generate_release_notes: true
          # Same list in release above.
          fail_on_unmatched_files: true
          files: |
            dist/playgta5-launcher-linux-x64.tar.gz
            dist/playgta5-launcher-macos-arm64.zip
            dist/playgta5-launcher-windows-x64.zip
            dist/playgta5-launcher-android.apk
