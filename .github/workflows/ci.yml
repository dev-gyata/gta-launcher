name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  analyze:
    name: analyze
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter --version
      - run: flutter pub get

      # The analyzer resolves each package against its own package config,
      # so the nested packages need their dependencies fetched too
      # (their .dart_tool/ dirs are gitignored build state).
      - name: Get nested package dependencies
        run: |
          (cd packages/torrent_engine && dart pub get)
          (cd packages/torrent_engine/tool/ffi_generator && dart pub get)

      - run: flutter analyze

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Cache native compilation
        uses: ./.github/actions/cache-native

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libssl-dev

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Set up Node (for worker cache test)
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - run: flutter --version
      - run: flutter pub get
      - run: flutter test
      - run: node test/site/worker_cache_test.cjs

  android:
    name: android build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter build apk --debug
