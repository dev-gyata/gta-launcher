name: Cache pub packages
description: Restore and save the pub package cache. The Flutter SDK itself is not cached (setup downloads it in about a minute; its 1.6-2.1 GB caches per OS and branch filled the repository's 10 GB cache limit and evicted the native build caches).
runs:
  using: composite
  steps:
    - uses: actions/cache@v4
      with:
        # PUB_CACHE defaults: ~/.pub-cache on Linux and macOS, %LOCALAPPDATA%\Pub\Cache on Windows
        path: |
          ~/.pub-cache
          ~/AppData/Local/Pub/Cache
        key: pub-v1-${{ runner.os }}-${{ hashFiles('pubspec.lock', 'packages/torrent_engine/pubspec.lock') }}
        restore-keys: pub-v1-${{ runner.os }}-
